acceptance_criteria:
  - Prototype renders live pulse for US, TW and Options with report date, regime, movers and a stale/degraded state.
  - Pulse builder verifies payload data_hash against the pointer and fails closed.
  - Latest news cards deep-link to news.dappgo.com by market and stock.
  - Store/web links match config/product-catalog.json.
  - Business section stays prominent; research disclaimer preserved.
  - Responsive at 375px and desktop, light/dark, no console errors.
