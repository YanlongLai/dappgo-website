title: Bold dappgo.com redesign with live market pulse and news connected to products
status: proposed
risk: medium
question: Can the homepage show verified, current product output (US/TW/Options pulse and latest news) in a bold new visual system without regressing privacy, performance or store accuracy?
hypotheses:
  - A compact, hash-verified pulse.json derived from the published latest pointers lets the static homepage show live product output without loading 1.5-4 MB payloads.
  - A product-first, data-forward visual system makes each product's value visible before the visitor clicks.
