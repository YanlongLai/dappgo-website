name: homepage-pulse

# Rebuilds data/pulse.json from the hash-verified data.dappgo.com pointers and
# commits it, the EN/zh homepage snapshots, and news/ to GitHub master (canonical; GitHub Pages serves dappgo.com).
# Gitea is a one-way mirror, so the commit is pushed to GitHub, never to Gitea.
# Holidays and repeat runs are no-ops when both pulse and news are unchanged,
# unless deploy_news=true requests another upload of the current master.
# dappgo-news is direct-upload: pushing master alone does not deploy news/.
on:
  schedule:
    - cron: '20 9 * * 1-5'   # after the Taiwan final publish (~08:40 UTC)
    - cron: '15 20 * * 1-5'  # after the US / options intraday publish (~19:45 UTC)
    - cron: '45 22 * * 1-5'  # after the US close
  workflow_dispatch:
    inputs:
      deploy_news:
        description: Deploy news even when the pulse and news snapshots are unchanged
        type: boolean
        required: false
        default: false

jobs:
  refresh:
    runs-on: dappgo-pulse-host
    timeout-minutes: 10
    outputs:
      deploy_news: ${{ steps.publish.outputs.deploy_news }}
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Refresh and publish pulse
        id: publish
        env:
          PUSH_TOKEN: ${{ secrets.DAPPGO_WEBSITE_PUSH_TOKEN }}
          FORCE_DEPLOY_NEWS: ${{ github.event.inputs.deploy_news }}
        run: |
          set -Eeuo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::DAPPGO_WEBSITE_PUSH_TOKEN is not configured; refusing to build an unpublishable pulse." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          remote="https://github.com/YanlongLai/dappgo-website.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" clone --quiet --depth 20 --branch master "$remote" "$work/site"
          cd "$work/site"
          git config user.name "DappGo Pulse"
          git config user.email "automation@dappgo.com"
          deploy_news=false
          pushed_commit=""
          if [ "${FORCE_DEPLOY_NEWS:-false}" = "true" ]; then
            deploy_news=true
          fi
          published=false
          for attempt in 1 2 3; do
            node scripts/build-pulse.mjs
            node scripts/verify-pulse.mjs
            node scripts/build-news-html.mjs --generated-at-file "$work/news-generated-at-utc"
            git add -- news/
            if git diff --quiet HEAD -- data/pulse.json index.html zh/index.html news/; then
              echo "pulse and news unchanged; nothing to publish"
              published=true
              break
            fi
            dates="$(node -e 'const m=require("./data/pulse.json").markets;console.log(["us","tw","options"].map(k=>`${k} ${m[k].report_date}`).join(", "))')"
            git commit --quiet -m "chore(pulse): refresh homepage pulse (${dates})" -- data/pulse.json index.html zh/index.html news/
            if git -c http.extraheader="$auth" push --quiet origin HEAD:master; then
              pushed_commit="$(git rev-parse HEAD)"
              echo "published $pushed_commit"
              # Inspect the successfully pushed commit, never the working tree.
              news_files="$(git diff-tree --no-commit-id --name-only -r --root "$pushed_commit" -- news/)"
              if [ -n "$news_files" ]; then
                deploy_news=true
              fi
              published=true
              break
            fi
            echo "push rejected (attempt ${attempt}); rebasing on the latest master" >&2
            git reset --quiet --hard HEAD~1
            git -c http.extraheader="$auth" pull --quiet --ff-only origin master
          done
          if [ "$published" != "true" ]; then
            echo "::error::pulse push failed after 3 attempts" >&2
            exit 1
          fi
          [ -n "$pushed_commit" ] || pushed_commit="$(git rev-parse HEAD)"
          printf 'deploy_news=%s\n' "$deploy_news" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$pushed_commit" >> "$GITHUB_OUTPUT"

  deploy-news:
    # Wrangler 4.149 needs Node >= 22; dappgo-pulse-host runs Node 20, so the
    # upload runs on the dappgo-ci runner from a fresh clone of the commit that
    # the refresh job pushed to GitHub master.
    needs: refresh
    if: ${{ needs.refresh.outputs.deploy_news == 'true' }}
    runs-on: dappgo-ci
    timeout-minutes: 15
    steps:
      - name: Deploy and verify news
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          DEPLOY_COMMIT: ${{ needs.refresh.outputs.commit }}
        run: |
          set -Eeuo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::News HTML was committed to GitHub master but not deployed: CLOUDFLARE_PAGES_TOKEN is missing; Owner must add it and rerun with deploy_news=true."
            exit 0
          fi
          [[ "$(node --version)" == v22.* ]] || { echo "::error::deploy-news needs Node 22 (Wrangler 4.149); got $(node --version)" >&2; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git clone --quiet --depth 50 --branch master https://github.com/YanlongLai/dappgo-website.git "$work/site"
          cd "$work/site"
          git checkout --quiet "$DEPLOY_COMMIT"
          bash scripts/deploy-news.sh
