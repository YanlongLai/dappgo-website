name: homepage-pulse

# Rebuilds data/pulse.json from the hash-verified data.dappgo.com pointers and
# commits it to GitHub master (canonical; GitHub Pages serves dappgo.com).
# Gitea is a one-way mirror, so the commit is pushed to GitHub, never to Gitea.
# Holidays and repeat runs are no-ops: an unchanged pulse is not committed.
on:
  schedule:
    - cron: '20 9 * * 1-5'   # after the Taiwan final publish (~08:40 UTC)
    - cron: '15 20 * * 1-5'  # after the US / options intraday publish (~19:45 UTC)
    - cron: '45 22 * * 1-5'  # after the US close
  workflow_dispatch:

jobs:
  refresh:
    runs-on: dappgo-pulse-host
    timeout-minutes: 10
    steps:
      - name: Refresh and publish pulse
        env:
          PUSH_TOKEN: ${{ secrets.DAPPGO_WEBSITE_PUSH_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::error::DAPPGO_WEBSITE_PUSH_TOKEN is not configured; refusing to build an unpublishable pulse." >&2
            exit 1
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          remote="https://github.com/YanlongLai/dappgo-website.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          # Non-secret preflight: token kind and the repo permissions GitHub grants it.
          case "$PUSH_TOKEN" in github_pat_*) kind=fine-grained ;; ghp_*) kind=classic ;; *) kind=other ;; esac
          api="$(curl -sS -D "$work/h" -o "$work/repo.json" -w '%{http_code}' -H "Authorization: Bearer $PUSH_TOKEN" https://api.github.com/repos/YanlongLai/dappgo-website || true)"
          perms="$(node -e 'try{console.log(JSON.stringify(require(process.argv[1]).permissions||null))}catch{console.log("unreadable")}' "$work/repo.json")"
          echo "token kind=${kind} length=${#PUSH_TOKEN} api=${api} permissions=${perms}"
          grep -iE '^(x-accepted-github-permissions|github-authentication-token-expiration|x-oauth-scopes):' "$work/h" || true
          # Write probes that cannot mutate: an empty contents PUT is 422 with write access, 403 without;
          # the receive-pack advertisement is what git push is authorised against.
          wprobe="$(curl -sS -o "$work/w.json" -w '%{http_code}' -X PUT -H "Authorization: Bearer $PUSH_TOKEN" -d '{}' https://api.github.com/repos/YanlongLai/dappgo-website/contents/.pulse-probe || true)"
          echo "contents-write probe=${wprobe} $(node -e 'try{console.log(require(process.argv[1]).message||"")}catch{}' "$work/w.json")"
          rp="https://github.com/YanlongLai/dappgo-website.git/info/refs?service=git-receive-pack"
          echo "receive-pack basic=$(curl -s -o /dev/null -w '%{http_code}' -H "$auth" "$rp") bearer=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PUSH_TOKEN" "$rp") userpass=$(curl -s -o /dev/null -w '%{http_code}' -u "YanlongLai:$PUSH_TOKEN" "$rp")"
          git -c http.extraheader="$auth" clone --quiet --depth 20 --branch master "$remote" "$work/site"
          cd "$work/site"
          git config user.name "DappGo Pulse"
          git config user.email "automation@dappgo.com"
          for attempt in 1 2 3; do
            node scripts/build-pulse.mjs
            node scripts/verify-pulse.mjs
            if git diff --quiet -- data/pulse.json; then
              echo "pulse unchanged; nothing to publish"
              exit 0
            fi
            dates="$(node -e 'const m=require("./data/pulse.json").markets;console.log(["us","tw","options"].map(k=>`${k} ${m[k].report_date}`).join(", "))')"
            git commit --quiet -m "chore(pulse): refresh homepage pulse (${dates})" -- data/pulse.json
            if git -c http.extraheader="$auth" push --quiet origin HEAD:master; then
              echo "published $(git rev-parse HEAD)"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing on the latest master" >&2
            git reset --quiet --hard HEAD~1
            git -c http.extraheader="$auth" pull --quiet --ff-only origin master
          done
          echo "::error::pulse push failed after 3 attempts" >&2
          exit 1
